deptrac:
  paths:
    - ./app
  layers:
    - name: Identity
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\.+#'
    - name: Settings
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Settings\\.+#'
    - name: HR
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\HR\\.+#'
    - name: Finance
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Finance\\.+#'
    - name: Payroll
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Payroll\\.+#'
    - name: Tasks
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Tasks\\.+#'
  ruleset:
    Identity: []
    Settings: []
    HR:
      - Identity
    Finance:
      - Identity
      - Settings
    Payroll:
      - Finance
      - HR
      - Identity
      - Settings
    Tasks:
      - HR
      - Identity
