deptrac:
  paths:
    - ./app
  layers:
    - name: Identity
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\.+#'
    - name: Settings
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Settings\\.+#'
    - name: HR
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\HR\\.+#'
    - name: Payroll
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Payroll\\.+#'
  ruleset:
    Identity: []
    Settings: []
    HR:
      - Identity
    Payroll:
      - HR
      - Identity
      - Settings