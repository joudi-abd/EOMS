<figure class="chart">
  <svg
    class="chart-svg"
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    role="img"
    [attr.aria-label]="label()"
    (pointermove)="track($event)"
    (pointerleave)="active.set(null)"
  >
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" [style.stop-color]="series()[0]?.color" stop-opacity="0.22" />
        <stop offset="100%" [style.stop-color]="series()[0]?.color" stop-opacity="0" />
      </linearGradient>
    </defs>
    @for (tick of ticks(); track tick.value) {
      <line class="grid" [attr.x1]="rtl() ? pad.end : pad.start" [attr.x2]="rtl() ? width() - pad.start : width() - pad.end" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="axis" [attr.x]="axisX()" [attr.y]="tick.y + 4" text-anchor="end">{{ format(tick.value) }}</text>
    }
    @for (line of lines(); track line.key) {
      @if (line.area) {
        <path [attr.d]="line.area" [attr.fill]="'url(#' + gradientId + ')'" />
      }
      <path class="line" [attr.d]="line.path" [style.stroke]="line.color" />
    }
    @if (tip(); as box) {
      <line class="cursor" [attr.x1]="box.guide" [attr.x2]="box.guide" [attr.y1]="pad.top" [attr.y2]="pad.top + plot().height" />
      @for (line of lines(); track line.key) {
        <circle class="dot" [attr.cx]="line.points[active()!].x" [attr.cy]="line.points[active()!].y" r="4" [style.stroke]="line.color" />
      }
    }
    @for (item of labels(); track $index) {
      @if (item.shown) {
        <text class="axis" [attr.x]="item.x" [attr.y]="height() - 10" text-anchor="middle">{{ item.text }}</text>
      }
    }
  </svg>
  @if (tip(); as box) {
    <div class="tip" [style.left.px]="box.x" aria-hidden="true">
      <strong>{{ box.title }}</strong>
      @for (row of box.rows; track row.label) {
        <span><i [style.background]="row.color"></i>{{ row.label }} <b>{{ row.value }}</b></span>
      }
    </div>
  }
  @if (series().length > 1) {
    <figcaption class="legend">
      @for (item of series(); track item.key) {
        <span><i [style.background]="item.color"></i>{{ item.label }}</span>
      }
    </figcaption>
  }
  <table class="vh">
    <caption>{{ label() }}</caption>
    <tr>
      <th></th>
      @for (item of series(); track item.key) {
        <th>{{ item.label }}</th>
      }
    </tr>
    @for (row of data(); track $index) {
      <tr>
        <th>{{ row.label }}</th>
        @for (item of series(); track item.key) {
          <td>{{ format(row.values[item.key] ?? 0) }}</td>
        }
      </tr>
    }
  </table>
</figure>
