<div class="grid-2">
  @if (session.can('payroll')) {
    <section class="panel" data-print>
      <header class="panel-head">
        <div>
          <h2>{{ t('payrollTitle') }}</h2>
          @if (insights.payroll(); as payroll) {
            <p>{{ payroll.month }} · {{ t(runStatusKey[payroll.run.status]) }}</p>
          }
        </div>
        <a class="text small" routerLink="/modules/payroll">{{ t('payroll') }}</a>
      </header>
      @if (insights.payroll(); as payroll) {
        <app-donut-chart [slices]="payroll.slices" [label]="t('payrollTitle')" [center]="t('runEmployees')" />
      } @else {
        <p class="empty">{{ t('noRunsHint') }}</p>
      }
    </section>
  }
</div>
