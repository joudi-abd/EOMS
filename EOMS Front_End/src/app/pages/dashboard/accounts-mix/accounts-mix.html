<div class="grid-2">
  <section class="panel" data-print>
    <header class="panel-head">
      <div>
        <h2>{{ t('accountsTitle') }}</h2>
        <p>{{ t('accountsCaption') }}</p>
      </div>
      <a class="text small" routerLink="/modules/access">{{ t('access') }}</a>
    </header>
    <app-rank-chart [rows]="insights.accountsByRole()" [label]="t('accountsTitle')" />
  </section>
  <section class="panel" data-print>
    <header class="panel-head">
      <div>
        <h2>{{ t('accountStateTitle') }}</h2>
      </div>
    </header>
    <app-donut-chart [slices]="insights.accountState()" [label]="t('accountStateTitle')" [center]="t('accountsWord')" />
  </section>
</div>
