<main class="work" id="content">
  @if (!session.has('finance.view')) {
    <h1>{{ t(title) }}</h1>
    <p class="empty">{{ t('noAccess') }}</p>
    <a class="primary" routerLink="/">{{ t('back') }}</a>
  } @else {
    <app-notice />
    <header class="heading">
      <div>
        <h1>{{ t(title) }}</h1>
        <p class="lede">{{ t(lede) }}</p>
      </div>
    </header>

    @switch (view) {
      @case ('cash') { <app-finance-cash /> }
      @case ('invoices') { <app-finance-invoices /> }
      @case ('items') { <app-finance-items /> }
      @case ('ledger') { <app-finance-ledger /> }
      @case ('reports') { <app-finance-reports /> }
    }
  }
</main>
