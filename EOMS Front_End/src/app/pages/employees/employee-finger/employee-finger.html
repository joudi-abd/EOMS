<section class="finger">
  <p class="state" aria-live="polite">
    <i class="fa-solid fa-fingerprint" aria-hidden="true"></i>
    <strong [class.ok]="person().fingerprint === 'enrolled'">{{ t(fingerKey[person().fingerprint]) }}</strong>
  </p>
  <dl class="facts">
    <div>
      <dt>{{ t('pinLabel') }}</dt>
      <dd class="mono"><bdi>{{ pin() || '—' }}</bdi></dd>
    </div>
  </dl>
  @if (mayEnroll()) {
    <button class="primary" type="button" (click)="openEnroll()">
      <i class="fa-solid fa-fingerprint" aria-hidden="true"></i>
      {{ t('enrollOpen') }}
    </button>
  }
  <p class="note">{{ t('fingerServerNote') }}</p>
</section>

@if (enrolling()) {
  <app-finger-dialog [person]="person()" (closed)="closeEnroll()" />
}
