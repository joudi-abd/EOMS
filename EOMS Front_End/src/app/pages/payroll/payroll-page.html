<main class="work" id="content">
  <button class="menu" type="button" (click)="chrome.toggle()">
    <i class="fa-solid" [class.fa-bars]="!chrome.menuOpen()" [class.fa-xmark]="chrome.menuOpen()" aria-hidden="true"></i>
    {{ chrome.menuOpen() ? t('closeMenu') : t('menu') }}
  </button>
  @if (!session.can('payroll') && !session.has('attendance.view')) {
    <h1>{{ t('payroll') }}</h1>
    <p class="empty">{{ t('noAccess') }}</p>
    <a class="primary" routerLink="/">{{ t('back') }}</a>
  } @else {
    <app-notice />
    <header class="heading"><h1>{{ t('payrollFactsTitle') }}</h1></header>
    <app-payroll-facts />
  }
</main>
