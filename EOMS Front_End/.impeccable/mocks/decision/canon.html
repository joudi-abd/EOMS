<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:"Readex Pro",sans-serif;background:#F7F8FA;color:#111827}
.app{display:flex;height:900px}
aside{width:230px;background:#fff;border-left:1px solid #E5E7EB;padding:24px 16px}
.mark{font-size:22px;font-weight:700;color:#2563EB}
nav a{display:block;text-decoration:none;color:#374151;font-size:14px;padding:8px 10px;border-radius:8px}
nav a.on{background:#EFF6FF;color:#2563EB;font-weight:600}
main{flex:1;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px}
.card b{display:block;font-size:28px;margin-top:6px}
.card span{font-size:13px;color:#6B7280}
.panel{margin-top:14px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:12px;height:140px}
.bars i{display:block;width:36px;background:#2563EB;border-radius:6px 6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 0;border-bottom:1px solid #E5E7EB}
button{background:#2563EB;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="mark">EOMS</div>
    <nav>
      <a class="on" href="#">لوحة المعلومات</a>
      <a href="#">الموظفون</a>
      <a href="#">الحضور</a>
      <a href="#">الإجازات</a>
      <a href="#">المشاريع</a>
      <a href="#">المالية</a>
      <a href="#">المشتريات</a>
      <a href="#">المستندات</a>
    </nav>
  </aside>
  <main>
    <header>
      <h1>لوحة المعلومات</h1>
      <button type="button">اعتماد الإجازات</button>
    </header>
    <section class="cards">
      <article class="card"><span>الموظفون</span><b>٨٦</b></article>
      <article class="card"><span>الحضور اليوم</span><b>٧٩</b></article>
      <article class="card"><span>المشاريع</span><b>١١</b></article>
      <article class="card"><span>بانتظار الاعتماد</span><b>٤</b></article>
    </section>
    <section class="panel">
      <div class="bars">
        <i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:48%"></i>
      </div>
      <table>
        <thead><tr><th>المشروع</th><th>الإنجاز</th><th>الحالة</th></tr></thead>
        <tbody>
          <tr><td>الواجهة البحرية</td><td>٦٨٪</td><td>متأخر</td></tr>
          <tr><td>مدرسة الرواد</td><td>٤١٪</td><td>متأخر</td></tr>
          <tr><td>برج النخيل</td><td>٢٢٪</td><td>في الموعد</td></tr>
          <tr><td>عيادة النور</td><td>٩١٪</td><td>تسليم</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
